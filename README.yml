module_name: "Terraform VPC Module"
module_description: The Terraform Wrapper for VPC simplifies the configuration of basic Networking services (VPC / Subnets / Route Tables / IGW / NatGW / NACL / VPC Endpoints / Flow Logs) using a structured map of VPCs and local AWS modules.
module_badges:
  - url: "https://github.com/gocloudLa/terraform-aws-wrapper-vpc/releases/latest"
    image: "https://img.shields.io/github/v/release/gocloudLa/terraform-aws-wrapper-vpc.svg?style=for-the-badge"
    alt: "Latest Release"
  - url: ""
    image: "https://img.shields.io/github/last-commit/gocloudLa/terraform-aws-wrapper-vpc.svg?style=for-the-badge"
    alt: "Last Commit"
  - url: "https://registry.terraform.io/modules/gocloudLa/wrapper-vpc/aws"
    image: "https://img.shields.io/badge/Terraform-Registry-7B42BC?style=for-the-badge&logo=terraform&logoColor=white"
    alt: "Terraform Registry"
quick_start: |
  ```hcl
  vpc_parameters = {
    "prod" = {
      vpc_cidr = "10.15.0.0/16"

      flow_logs = {
        "00" = {
          enable_flow_log = false
        }
      }
      internet_gateway = {
        "igw" = {}
      }
      nat_gateway = {
        "natgw" = {
          subnet = "public-a"
          kind   = "aws"
        }
      }
      route_table = {
        "private" = {
          default_route = { nat_gateway = "natgw" }
        }
        "public" = {
          default_route = { gateway = "igw" }
        }
      }
      network_acl = {
        "private" = { rules = {} }
        "public"  = { rules = {} }
      }
      subnets = {
        "private" = {
          "a" = {
            cidr_block  = cidrsubnet("10.15.0.0/16", 4, 0)
            az          = "a"
            route_table = "private"
            network_acl = "private"
          }
          "b" = {
            cidr_block  = cidrsubnet("10.15.0.0/16", 4, 1)
            az          = "b"
            route_table = "private"
            network_acl = "private"
          }
        }
        "public" = {
          "a" = {
            cidr_block  = cidrsubnet("10.15.0.0/16", 4, 3)
            az          = "a"
            route_table = "public"
            network_acl = "public"
          }
          "b" = {
            cidr_block  = cidrsubnet("10.15.0.0/16", 4, 4)
            az          = "b"
            route_table = "public"
            network_acl = "public"
          }
        }
      }
      endpoints = {
        "00" = {
          service         = "s3"
          service_type    = "Gateway"
          route_table_ids = ["private", "public"]
          policy          = null
        }
      }
    }
  }
  ```
features:
  - icon: 🖥️
    title: Custom EC2 NAT Gateway
    short_description: Deploy cost-effective EC2-based NAT Gateway instead of managed NAT Gateway
    long_description: |
      Configure a custom EC2 instance as NAT Gateway for private subnet internet access, providing a cost-effective alternative to AWS managed NAT Gateway service.
      Use `ingress_with_cidr_blocks` inside `nat_parameters` to restrict which source CIDRs can route through the NAT instance's security group; omit the key to allow all traffic from the VPC CIDR by default.
    examples:
      - title: EC2 NAT Gateway Configuration
        code: |
          ```hcl
          vpc_parameters = {
            "main" = {
              vpc_cidr = "10.130.0.0/16"
              internet_gateway = { "00-igw" = {} }
              nat_gateway = {
                "natgw" = {
                  subnet = "public-a"
                  kind   = "ec2"
                  nat_parameters = {
                    ec2_nat_gateway_attach_eip = true
                    connectivity_type          = "public"
                    # ingress_with_cidr_blocks = [
                    #   {
                    #     rule        = "all-all"
                    #     cidr_blocks = "10.100.0.0/16,10.101.0.0/16"
                    #   }
                    # ]
                  }
                }
              }
              route_table = {
                "00-private" = { default_route = { network_interface = "natgw" } }
                "00-public"  = { default_route = { gateway = "00-igw" } }
              }
              network_acl = {}
              subnets     = { ... }
            }
          }
          ```
  - icon: 🌐
    title: Per-VPC top-level attributes
    short_description: VPC CIDR, IPAM, DNS, DHCP options and tags inside each `vpc_parameters.<key>`
    long_description: |
      Top-level keys for each VPC entry. Omit optional keys to use defaults.
    examples:
      - title: Per-VPC top-level example
        code: |
          ```hcl
          vpc_parameters = {
            "main" = {
              custom_common_name = "myco-prd-main"

              vpc_cidr                           = "10.130.0.0/16"
              use_ipam_pool                      = false
              ipv4_ipam_pool_id                  = null
              ipv4_netmask_length                = null
              enable_ipv6                        = false
              ipv6_cidr_block                    = null
              ipv6_ipam_pool_id                  = null
              ipv6_netmask_length                = null
              ipv6_cidr_block_network_border_group = null

              instance_tenancy                     = "default"
              enable_dns_hostnames                 = true
              enable_dns_support                   = true
              enable_network_address_usage_metrics = null

              enable_dhcp_options               = false
              dhcp_options_domain_name          = ""
              dhcp_options_domain_name_servers  = []
              dhcp_options_ntp_servers          = []
              dhcp_options_netbios_name_servers = []
              dhcp_options_netbios_node_type    = ""

              tags = { "extra" = "value" }
            }
          }
          ```
  - icon: 🔌
    title: internet_gateway map
    short_description: Define one or more Internet Gateways per VPC
    long_description: |
      Map of IGW names to optional config. Each key becomes an IGW; values can override create flags and tags.
    examples:
      - title: internet_gateway example
        code: |
          ```hcl
          internet_gateway = {
            "00-igw" = {
              create_internet_gateway = true
              create_egress_only_igw  = false
              tags                    = {}
            }
          }
          ```
  - icon: 🛡️
    title: network_acl map
    short_description: Dedicated Network ACLs per VPC
    long_description: |
      Map of NACL names to rules and tags. Subnets reference these by name via `network_acl`.
    examples:
      - title: network_acl example
        code: |
          ```hcl
          network_acl = {
            "private-nacl" = {
              create_network_acl = true
              rules              = {}
              tags               = {}
            }
          }
          ```
  - icon: 📍
    title: subnets map
    short_description: Nested map of subnet groups and AZs with full subnet options
    long_description: |
      Structure is `subnets.<group>.<az_key>`. Each subnet can set route_table, network_acl, and optional DNS/IPv6/outpost options.
    examples:
      - title: subnets example
        code: |
          ```hcl
          subnets = {
            "private" = {
              "a" = {
                create_subnet  = true
                cidr_block     = cidrsubnet("10.130.0.0/16", 4, 0)
                az             = "a"
                route_table    = "00-private"
                network_acl    = "private-nacl"
                enable_dns64   = false
                enable_resource_name_dns_aaaa_record_on_launch = false
                enable_resource_name_dns_a_record_on_launch    = false
                private_dns_hostname_type_on_launch            = null
                map_public_ip_on_launch = false
                enable_lni_at_device_index = null
                outpost_arn                     = null
                map_customer_owned_ip_on_launch = null
                customer_owned_ipv4_pool        = null
                tags = {}
              }
            }
            "public" = {
              "a" = {
                create_subnet  = true
                cidr_block     = cidrsubnet("10.130.0.0/16", 4, 3)
                az             = "a"
                route_table    = "00-public"
                network_acl    = ""
                map_public_ip_on_launch = true
                tags = {}
              }
            }
          }
          ```
  - icon: 🔀
    title: nat_gateway map
    short_description: AWS or EC2 NAT Gateways per VPC
    long_description: |
      Map of NAT names to config. Use `kind = "aws"` or `"ec2"`. Subnet key must match `{group}-{region}{az}` (e.g. `public-us-east-1a`).
    examples:
      - title: nat_gateway example
        code: |
          ```hcl
          nat_gateway = {
            "natgw" = {
              create_nat_gateway = true
              kind               = "aws"
              subnet             = "public-a"
              nat_parameters = {
                connectivity_type                  = "public"
                private_ip                         = null
                secondary_allocation_ids           = null
                secondary_private_ip_address_count = null
                secondary_private_ip_addresses     = null
                ec2_nat_gateway_attach_eip = false
              }
              tags = {}
            }
          }
          ```
  - icon: 🛤️
    title: route_table map
    short_description: Route tables with default route and optional extra routes
    long_description: |
      Map of route table names to config. `default_route` sets 0.0.0.0/0 via `gateway`, `network_interface`, or `nat_gateway` (by name). `routes` adds named routes.
    examples:
      - title: route_table example
        code: |
          ```hcl
          route_table = {
            "00-private" = {
              create_route_table = true
              default_route = {
                nat_gateway            = "natgw"
                nat_gateway_id         = null
                gateway                = null
                gateway_id             = null
                network_interface     = null
                network_interface_id   = null
                vpc_endpoint_id        = null
                transit_gateway_id     = null
                vpc_peering_connection_id = null
                core_network_arn       = null
                carrier_gateway_id     = null
                local_gateway_id       = null
              }
              routes = {
                "to-onprem" = {
                  destination_cidr_block      = "10.0.0.0/8"
                  destination_ipv6_cidr_block = null
                  transit_gateway_id          = "tgw-xxx"
                }
              }
            }
            "00-public" = {
              create_route_table = true
              default_route = { gateway = "00-igw" }
              routes = {}
            }
          }
          ```
  - icon: 📋
    title: flow_logs map
    short_description: VPC Flow Logs to CloudWatch or S3
    long_description: |
      Map of flow log names to destination, IAM, and format options.
    examples:
      - title: flow_logs example
        code: |
          ```hcl
          flow_logs = {
            "default" = {
              enable_flow_log                                 = true
              create_flow_log_cloudwatch_iam_role             = true
              create_flow_log_cloudwatch_log_group            = true
              vpc_flow_log_permissions_boundary               = null
              flow_log_traffic_type                           = "ALL"
              flow_log_destination_type                       = "cloud-watch-logs"
              flow_log_log_format                             = null
              flow_log_destination_arn                        = ""
              flow_log_cloudwatch_iam_role_arn                = ""
              flow_log_cloudwatch_log_group_name_prefix       = ""
              flow_log_cloudwatch_log_group_retention_in_days = 365
              flow_log_cloudwatch_log_group_kms_key_id        = null
              flow_log_max_aggregation_interval               = 600
              flow_log_hive_compatible_partitions             = false
              flow_log_per_hour_partition                     = false
              tags                                            = {}
            }
          }
          ```
  - icon: 🔗
    title: endpoints map
    short_description: Gateway and Interface VPC endpoints
    long_description: |
      Map of endpoint keys to service name, type (Gateway/Interface), route tables, and optional policy.
    examples:
      - title: endpoints example
        code: |
          ```hcl
          endpoints = {
            "00" = {
              service             = "s3"
              service_name        = null
              service_type        = "Gateway"
              route_table_ids     = ["00-private", "00-public"]
              policy              = data.aws_iam_policy_document.s3_endpoint_policy.json
              private_dns_enabled = false
              security_group_ids  = []
              tags                = {}
            }
            "01" = {
              service         = "dynamodb"
              service_type    = "Gateway"
              route_table_ids = ["00-private", "00-public"]
              policy          = null
              tags            = {}
            }
          }
          ```

  - icon: 🏷️
    title: Tag merging and precedence
    short_description: All resources merge tags from three layers with clear override priority
    long_description: |
      Every resource created by this module merges tags from three sources using `merge()`. Because Terraform's `merge()` gives precedence to later maps (last key wins), the effective priority from lowest to highest is:

      1. `local.common_tags` (lowest) — platform-level tags injected by `metadata.tf` (e.g. `Environment`, `Project`, `ManagedBy`).
      2. Auto-generated `Name` tag — computed by the wrapper as `{common_name}-{resource_key}`.
      3. Per-entry `tags` key (highest) — user-supplied tags inside each `vpc_parameters` entry or sub-resource map.

      This means a `tags` map you provide at the entry level can override any platform tag, including the `Name` tag if needed.
    examples:
      - title: Tag override example
        code: |
          ```hcl
          vpc_parameters = {
            "main" = {
              vpc_cidr = "10.130.0.0/16"

              # These tags override any matching key from local.common_tags
              tags = {
                CostCenter  = "engineering"
                Name        = "custom-vpc-name"   # overrides the auto-generated Name
              }

              subnets = {
                "private" = {
                  "a" = {
                    cidr_block  = "10.130.0.0/20"
                    az          = "a"
                    route_table = "private"
                    network_acl = "private"
                    # Subnet-level tags also follow the same merge order
                    tags = { Team = "backend" }
                  }
                }
              }
            }
          }
          ```
important_notes: |
  - Each key under `vpc_parameters` is a VPC identifier. Subnet keys are built as `{vpc_key}-{subnet_group}-{az_name}` (e.g. `main-public-us-east-1a`).
  - NAT gateway `subnet` must reference the subnet group and AZ (e.g. `public-us-east-1a`) so the module can resolve `module.subnet["{vpc_key}-{subnet}"]`.
  - Route table `default_route` can use `gateway` (IGW name), `network_interface` (NAT name), or `nat_gateway` (NAT name) to set the default 0.0.0.0/0 route.
  - See `examples/simple` and `examples/complete` for full configurations.
input_table: |
  | vpc_cidr | CIDR block for the VPC. | `string` | `""` | yes |
  | secondary_cidr_blocks | Secondary CIDR block for the VPC. | `list(string)` | `""` | yes |
  | custom_common_name | Override the computed common name for this VPC entry. | `string` | `""` | no |
  | use_ipam_pool | Allocate CIDR from an IPAM pool instead of `vpc_cidr`. | `bool` | `false` | no |
  | ipv4_ipam_pool_id | IPAM IPv4 pool ID when `use_ipam_pool = true`. | `string` | `null` | no |
  | ipv4_netmask_length | Netmask length for IPAM-allocated IPv4 CIDR. | `number` | `null` | no |
  | enable_ipv6 | Enable IPv6 on the VPC. | `bool` | `false` | no |
  | ipv6_cidr_block | Static IPv6 CIDR block. | `string` | `null` | no |
  | ipv6_ipam_pool_id | IPAM IPv6 pool ID. | `string` | `null` | no |
  | ipv6_netmask_length | Netmask length for IPAM-allocated IPv6 CIDR. | `number` | `null` | no |
  | ipv6_cidr_block_network_border_group | Network border group for the IPv6 CIDR. | `string` | `null` | no |
  | instance_tenancy | Tenancy option for instances (`"default"` or `"dedicated"`). | `string` | `"default"` | no |
  | enable_dns_hostnames | Enable DNS hostnames in the VPC. | `bool` | `true` | no |
  | enable_dns_support | Enable DNS resolution in the VPC. | `bool` | `true` | no |
  | enable_network_address_usage_metrics | Enable network address usage metrics. | `bool` | `null` | no |
  | enable_dhcp_options | Associate custom DHCP options with the VPC. | `bool` | `false` | no |
  | dhcp_options_domain_name | Domain name for DHCP options. | `string` | `""` | no |
  | dhcp_options_domain_name_servers | DNS server list for DHCP options. | `list(string)` | `[]` | no |
  | dhcp_options_ntp_servers | NTP server list for DHCP options. | `list(string)` | `[]` | no |
  | dhcp_options_netbios_name_servers | NetBIOS name server list for DHCP options. | `list(string)` | `[]` | no |
  | dhcp_options_netbios_node_type | NetBIOS node type for DHCP options. | `string` | `""` | no |
  | tags | Additional tags merged into all resources in this VPC. | `map(string)` | `{}` | no |
  | internet_gateway | Map of IGW names to optional config (`create_internet_gateway`, `create_egress_only_igw`, `tags`). | `map` | `{}` | no |
  | nat_gateway | Map of NAT Gateway names to config (`subnet`, `kind`, `nat_parameters`, `tags`). | `map` | `{}` | no |
  | route_table | Map of route table names to config (`default_route`, `routes`, `tags`). | `map` | `{}` | no |
  | network_acl | Map of NACL names to config (`rules`, `tags`). | `map` | `{}` | no |
  | subnets | Nested map `subnets.<group>.<az_key>` with `cidr_block`, `az`, `route_table`, `network_acl`, and optional flags. | `map` | `{}` | no |
  | endpoints | Map of endpoint keys to config (`service`, `service_type`, `route_table_ids`, `policy`, etc.). | `map` | `{}` | no |
  | flow_logs | Map of flow log names to config (`enable_flow_log`, destination, IAM, and format options). | `map` | `{}` | no |
